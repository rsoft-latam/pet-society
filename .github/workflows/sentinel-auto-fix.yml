# =============================================================================
# Sentinel Auto-Fix - Se activa cuando CI falla
# =============================================================================

name: Sentinel Auto-Fix

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      error_message:
        description: 'Mensaje de error a analizar'
        required: true
        type: string

jobs:
  auto-fix:
    name: Analyze & Fix
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Failed Logs
        if: github.event_name == 'workflow_run'
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📋 Extrayendo logs del workflow fallido..."

          RUN_ID=${{ github.event.workflow_run.id }}

          # Obtener logs
          gh run view $RUN_ID --log-failed 2>&1 | tail -50 > error.txt || true

          if [ ! -s error.txt ]; then
            gh run view $RUN_ID --log 2>&1 | grep -i -B2 -A3 "error\|failed" | head -40 > error.txt || true
          fi

          # Limpiar caracteres problemáticos para JSON
          cat error.txt | tr '\n\r\t' '   ' | sed 's/"/\\"/g' | sed "s/'/\\'/g" | cut -c1-800 > error_clean.txt

          echo "error_file=error_clean.txt" >> $GITHUB_OUTPUT

      - name: Call Sentinel
        id: sentinel
        run: |
          echo "🤖 Llamando a Sentinel..."

          # Determinar mensaje de error
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ERROR_MSG="${{ github.event.inputs.error_message }}"
          else
            ERROR_MSG=$(cat error_clean.txt 2>/dev/null || echo "CI workflow failed")
          fi

          # Si no hay error, usar mensaje genérico
          if [ -z "$ERROR_MSG" ]; then
            ERROR_MSG="CI workflow failed - no specific error extracted"
          fi

          # Crear archivo JSON para evitar problemas de escape
          cat > /tmp/payload.json << 'EOFPAYLOAD'
          {
            "repo_url": "https://github.com/${{ github.repository }}",
            "error_logs": "PLACEHOLDER_ERROR",
            "branch": "${{ github.event.workflow_run.head_branch || 'main' }}",
            "max_fix_attempts": 2
          }
          EOFPAYLOAD

          # Reemplazar placeholder con error escapado usando Python
          python3 << EOFPYTHON
          import json
          import sys

          error_msg = """$ERROR_MSG"""

          # Limpiar el mensaje
          error_msg = error_msg.replace('\n', ' ').replace('\r', ' ').replace('\t', ' ')
          error_msg = ' '.join(error_msg.split())  # Normalizar espacios
          error_msg = error_msg[:1000]  # Limitar longitud

          payload = {
              "repo_url": "https://github.com/${{ github.repository }}",
              "error_logs": error_msg,
              "branch": "${{ github.event.workflow_run.head_branch || 'main' }}",
              "max_fix_attempts": 2
          }

          with open('/tmp/payload.json', 'w') as f:
              json.dump(payload, f)

          print("Payload created successfully")
          EOFPYTHON

          echo "📦 Payload:"
          cat /tmp/payload.json | head -c 500
          echo ""

          # Llamar a Sentinel
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.SENTINEL_URL }}/analyze-ci-error" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json || echo -e "\n500")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "📡 HTTP Status: $HTTP_CODE"
          echo "📦 Response: $BODY"

          # Extraer PR URL
          PR_URL=$(echo "$BODY" | jq -r '.pr_url // empty' 2>/dev/null || echo "")
          STATUS=$(echo "$BODY" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT

          if [ -n "$PR_URL" ] && [ "$PR_URL" != "null" ]; then
            echo "✅ Sentinel creó un PR: $PR_URL"
          else
            echo "⚠️ Sentinel no pudo crear un PR automático"
          fi

      - name: Summary
        run: |
          echo "## 🤖 Sentinel Auto-Fix Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.sentinel.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.sentinel.outputs.pr_url }}" ] && [ "${{ steps.sentinel.outputs.pr_url }}" != "null" ]; then
            echo "**Fix PR:** ${{ steps.sentinel.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          fi
