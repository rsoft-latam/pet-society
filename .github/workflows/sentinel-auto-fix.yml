# =============================================================================
# Sentinel Auto-Fix - Se activa cuando CI falla
# =============================================================================

name: Sentinel Auto-Fix

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      error_message:
        description: 'Mensaje de error a analizar'
        required: true
        type: string

jobs:
  auto-fix:
    name: Analyze & Fix
    # No ejecutar si la rama viene de Sentinel
    if: |
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Check if from Sentinel
        id: check
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          ACTOR="${{ github.actor }}"

          echo "Branch: $BRANCH"
          echo "Actor: $ACTOR"

          # Verificar si viene de Sentinel
          if [[ "$BRANCH" == *"sentinel"* ]] || \
             [[ "$BRANCH" == *"auto-fix"* ]] || \
             [[ "$BRANCH" == *"autofix"* ]] || \
             [[ "$BRANCH" == *"fix-ci"* ]] || \
             [[ "$ACTOR" == *"bot"* ]] || \
             [[ "$ACTOR" == *"sentinel"* ]]; then
            echo "⚠️ Skipping - PR comes from Sentinel or bot"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Proceeding - PR is from a human"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Get Failed Logs
        if: steps.check.outputs.skip != 'true' && github.event_name == 'workflow_run'
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📋 Extrayendo logs del workflow fallido..."

          RUN_ID=${{ github.event.workflow_run.id }}

          # Obtener logs
          gh run view $RUN_ID --log-failed 2>&1 | tail -50 > error.txt || true

          if [ ! -s error.txt ]; then
            gh run view $RUN_ID --log 2>&1 | grep -i -B2 -A3 "error\|failed" | head -40 > error.txt || true
          fi

          # Limpiar caracteres problemáticos para JSON
          cat error.txt | tr '\n\r\t' '   ' | sed 's/"/\\"/g' | sed "s/'/\\'/g" | cut -c1-800 > error_clean.txt

          echo "error_file=error_clean.txt" >> $GITHUB_OUTPUT

      - name: Call Sentinel
        if: steps.check.outputs.skip != 'true'
        id: sentinel
        run: |
          echo "🤖 Llamando a Sentinel..."

          # Determinar mensaje de error
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "${{ github.event.inputs.error_message }}" > /tmp/error_raw.txt
          else
            cp error_clean.txt /tmp/error_raw.txt 2>/dev/null || echo "CI workflow failed" > /tmp/error_raw.txt
          fi

          # Crear payload JSON usando Python (maneja escape correctamente)
          python3 << 'EOFPYTHON'
          import json
          import re

          # Leer error desde archivo
          try:
              with open('/tmp/error_raw.txt', 'r', encoding='utf-8', errors='ignore') as f:
                  error_msg = f.read()
          except:
              error_msg = "CI workflow failed - could not read error"

          # Limpiar caracteres problemáticos
          error_msg = re.sub(r'[\x00-\x1f\x7f-\x9f]', ' ', error_msg)  # Remove control chars
          error_msg = ' '.join(error_msg.split())  # Normalize whitespace
          error_msg = error_msg[:1000]  # Limit length

          if not error_msg.strip():
              error_msg = "CI workflow failed - no specific error extracted"

          payload = {
              "repo_url": "https://github.com/${{ github.repository }}",
              "error_logs": error_msg,
              "branch": "${{ github.event.workflow_run.head_branch || 'main' }}",
              "max_fix_attempts": 2
          }

          with open('/tmp/payload.json', 'w') as f:
              json.dump(payload, f, ensure_ascii=True)

          print("✅ Payload created successfully")
          print(f"Error length: {len(error_msg)} chars")
          EOFPYTHON

          echo "📦 Payload:"
          cat /tmp/payload.json | head -c 500
          echo ""

          # Llamar a Sentinel
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.SENTINEL_URL }}/analyze-ci-error" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json || echo -e "\n500")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "📡 HTTP Status: $HTTP_CODE"
          echo "📦 Response: $BODY"

          # Extraer PR URL
          PR_URL=$(echo "$BODY" | jq -r '.pr_url // empty' 2>/dev/null || echo "")
          STATUS=$(echo "$BODY" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT

          if [ -n "$PR_URL" ] && [ "$PR_URL" != "null" ]; then
            echo "✅ Sentinel creó un PR: $PR_URL"
          else
            echo "⚠️ Sentinel no pudo crear un PR automático"
          fi

      - name: Summary
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "## 🤖 Sentinel Auto-Fix Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.sentinel.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.sentinel.outputs.pr_url }}" ] && [ "${{ steps.sentinel.outputs.pr_url }}" != "null" ]; then
            echo "**Fix PR:** ${{ steps.sentinel.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          fi
